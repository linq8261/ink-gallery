name: Release APK

# 打 tag 后自动构建已签名 APK 并发布到 GitHub Release
# tag 格式：YYYYMMDD-versionName-versionCode，例如 20261023-1.0.0-1
on:
  push:
    tags:
      - '*'                     # tag 格式在第一步里校验，不符合直接失败
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag，如 20261023-1.0.0-1'
        required: true
        default: ''
      dry_run:
        description: '只构建、不发布'
        type: boolean
        default: true

permissions:
  contents: write               # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 手动触发用输入的 tag，push tag 触发用 ref 名；
      # 这里用 shell 决定而不是在 env 里写表达式，避免表达式上下文引发的校验问题
      - name: 解析 tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: 校验 tag 与版本号
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^([0-9]{8})-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "::error::tag 格式应为 YYYYMMDD-x.y.z-N，实际：$TAG_NAME"
            exit 1
          fi
          TAG_VER="${BASH_REMATCH[2]}"
          TAG_CODE="${BASH_REMATCH[3]}"
          FILE_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          FILE_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "tag=$TAG_NAME / 仓库 versionName=$FILE_VER versionCode=$FILE_CODE"
          if [[ "$TAG_VER" != "$FILE_VER" || "$TAG_CODE" != "$FILE_CODE" ]]; then
            echo "::error::tag 里的版本($TAG_VER/$TAG_CODE) 与 build.gradle.kts($FILE_VER/$FILE_CODE) 不一致，先把版本号改好再打 tag"
            exit 1
          fi
          echo "APK_NAME=ink-gallery-$FILE_VER-$FILE_CODE.apk" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里的 wrapper 指向本机 D 盘的 gradle zip（本机离线用），Linux runner 上没有这个文件。
      # 这里按同一版本号改写成官方地址，并去掉 sha 校验（本地 zip 的校验和不一定与官方一致）。
      - name: 修正 Gradle wrapper 地址
        run: |
          set -euo pipefail
          PROPS=gradle/wrapper/gradle-wrapper.properties
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-all\.zip)' "$PROPS")
          echo "wrapper 版本：$VER"
          cat > "$PROPS" <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-$VER-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 还原签名配置
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          if [ ! -s keystore.jks ]; then
            echo "::error::keystore.jks 为空：请检查 KEYSTORE_BASE64 这个 Secret 是否已配置"
            exit 1
          fi
          ls -l keystore.jks
          # app/build.gradle.kts 里 storeFile = file(keystorePath)，相对路径是按 :app 模块目录解析的，
          # 所以必须写 ../keystore.jks 才能指到仓库根目录下刚还原出来的这个文件
          printf 'signing.storeFile=../keystore.jks\nsigning.storePassword=%s\nsigning.keyAlias=%s\nsigning.keyPassword=%s\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' '${{ secrets.KEY_ALIAS }}' '${{ secrets.KEY_PASSWORD }}' \
            > local.properties
          sed 's/Password=.*/Password=***/' local.properties

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "无法列出 platforms"
          # runner 用 bash -e 执行，pipefail 会让失败直接退出、跳过下面的诊断，所以这里先关掉
          set +e
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # 把日志尾部重新打成注解，方便直接在网页/接口里看到失败原因
            echo "::error::Gradle 构建失败（exit=$STATUS，日志 $(wc -l < gradle-build.log) 行），尾部如下"
            tail -n 8 gradle-build.log | while IFS= read -r line; do echo "::error::$line"; done
            ls -l app/build/outputs/apk/release/ 2>/dev/null || echo "release 输出目录不存在"
            exit 1
          fi
          ls -l app/build/outputs/apk/release/
          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: 试跑时上传产物
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          retention-days: 3

      - name: 创建 GitHub Release
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" "$APK_NAME" \
            --title "$TAG_NAME" \
            --generate-notes
